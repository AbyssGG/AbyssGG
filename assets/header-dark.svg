<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="AbyssGG - AI that runs on your machine, not in the cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8B949E" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    <![CDATA[
    /* the bright segment that sweeps along the ECG path, like a scope trace */
    .trace {
      stroke-dasharray: 90 1400;
      animation: sweep 2.6s linear infinite;
    }
    @keyframes sweep {
      from { stroke-dashoffset: 1490; }
      to   { stroke-dashoffset: 0; }
    }

    /* a real heartbeat is two beats then a rest, not an even pulse */
    .beat {
      transform-box: fill-box;
      transform-origin: center;
      animation: beat 1.15s ease-out infinite;
    }
    @keyframes beat {
      0%   { transform: scale(1);    opacity: 0.55; }
      6%   { transform: scale(1.95); opacity: 1;    }
      14%  { transform: scale(1.05); opacity: 0.65; }
      23%  { transform: scale(1.5);  opacity: 0.9;  }
      34%  { transform: scale(1);    opacity: 0.55; }
      100% { transform: scale(1);    opacity: 0.55; }
    }

    .ripple {
      transform-box: fill-box;
      transform-origin: center;
      animation: ripple 1.15s ease-out infinite;
    }
    @keyframes ripple {
      0%   { transform: scale(0.6); opacity: 0.5; }
      70%  { transform: scale(3.4); opacity: 0;   }
      100% { transform: scale(3.4); opacity: 0;   }
    }

    .breathe { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.75; }
      50%      { opacity: 1;    }
    }

    .blink   { animation: blink 3.2s ease-in-out infinite; }
    .blink-b { animation-delay: 0.7s; }
    .blink-c { animation-delay: 1.4s; }
    .blink-d { animation-delay: 2.1s; }
    @keyframes blink {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 0.75; }
    }

    /* respect visitors who have asked for less motion */
    @media (prefers-reduced-motion: reduce) {
      .trace, .beat, .ripple, .breathe, .blink {
        animation: none;
      }
      .trace { stroke-dasharray: none; }
    }
    ]]>
  </style>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- ECG: dim full trace underneath, bright sweeping segment on top -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#22D3EE" stroke-opacity="0.16" stroke-width="2"
          d="M660,160 L680,160 C686,148 694,148 700,160 L710,160 L716,170 L723,104 L730,196 L737,160 L748,160 C758,138 772,138 782,160 L795,160 L815,160 C821,148 829,148 835,160 L845,160 L851,170 L858,104 L865,196 L872,160 L883,160 C893,138 907,138 917,160 L930,160 L950,160 C956,148 964,148 970,160 L980,160 L986,170 L993,104 L1000,196 L1007,160 L1018,160 C1028,138 1042,138 1052,160 L1065,160 L1085,160 C1091,148 1099,148 1105,160 L1115,160 L1121,170 L1128,104 L1135,196 L1142,160 L1153,160 C1163,138 1177,138 1187,160 L1200,160"/>
    <path class="trace" stroke="#22D3EE" stroke-width="2.6" pathLength="1400"
          d="M660,160 L680,160 C686,148 694,148 700,160 L710,160 L716,170 L723,104 L730,196 L737,160 L748,160 C758,138 772,138 782,160 L795,160 L815,160 C821,148 829,148 835,160 L845,160 L851,170 L858,104 L865,196 L872,160 L883,160 C893,138 907,138 917,160 L930,160 L950,160 C956,148 964,148 970,160 L980,160 L986,170 L993,104 L1000,196 L1007,160 L1018,160 C1028,138 1042,138 1052,160 L1065,160 L1085,160 C1091,148 1099,148 1105,160 L1115,160 L1121,170 L1128,104 L1135,196 L1142,160 L1153,160 C1163,138 1177,138 1187,160 L1200,160"/>
  </g>

  <!-- the signal source: pulsing dot with an expanding ring -->
  <circle class="ripple" cx="636" cy="160" r="4" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
  <circle class="beat" cx="636" cy="160" r="4" fill="#22D3EE"/>

  <!-- scattered accents, offset so they don't blink in unison -->
  <g fill="#22D3EE">
    <circle class="blink" cx="1140" cy="96" r="3"/>
    <circle class="blink blink-b" cx="1176" cy="132" r="2"/>
    <circle class="blink blink-c" cx="1112" cy="228" r="2"/>
    <circle class="blink blink-d" cx="1164" cy="252" r="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="88" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="78" font-weight="700" fill="#E6EDF3" letter-spacing="1">AbyssGG</text>

  <rect class="breathe" x="90" y="176" width="86" height="4" rx="2" fill="url(#accent)"/>

  <text x="90" y="228" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="500" fill="#8B949E" letter-spacing="0.4">AI that runs on your machine, not in the cloud</text>
  <text x="90" y="262" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="18" fill="#546272" letter-spacing="1.6">NIM &#183; OPENVINO &#183; INTEL NPU &#183; C++</text>

  <rect x="0" y="317" width="1280" height="3" fill="url(#accent)"/>
</svg>
