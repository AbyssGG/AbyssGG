<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="AbyssGG - Native local AI inference in Nim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8B949E" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- decorative waveform: nods to on-device speech / signal work -->
  <g stroke="url(#wave)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M700 160 L730 160 L742 118 L754 202 L766 138 L778 182 L790 104 L802 216 L814 148 L826 172 L838 128 L850 192 L862 160 L892 160"/>
    <path d="M900 160 L930 160 L942 132 L954 188 L966 146 L978 174 L990 120 L1002 200 L1014 152 L1026 168 L1038 140 L1050 180 L1062 160 L1092 160" stroke-opacity="0.5"/>
  </g>
  <g fill="#22D3EE" fill-opacity="0.55">
    <circle cx="1140" cy="96" r="3"/>
    <circle cx="1176" cy="132" r="2"/>
    <circle cx="1112" cy="148" r="2"/>
    <circle cx="1164" cy="200" r="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="88" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="78" font-weight="700" fill="#E6EDF3" letter-spacing="1">AbyssGG</text>

  <rect x="90" y="176" width="86" height="4" rx="2" fill="url(#accent)"/>

  <text x="90" y="228" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="500" fill="#8B949E" letter-spacing="0.4">AI that runs on your machine, not in the cloud</text>
  <text x="90" y="262" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="18" fill="#546272" letter-spacing="1.6">NIM &#183; OPENVINO &#183; INTEL NPU &#183; C++</text>

  <rect x="0" y="317" width="1280" height="3" fill="url(#accent)"/>
</svg>
